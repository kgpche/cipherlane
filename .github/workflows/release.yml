name: Release

# 手动触发：只构建三平台产物并上传为 workflow artifact（不发布）
# 推送 v* 标签：构建三平台产物 + 生成 SHA256SUMS + 用官方 gh CLI 发布 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 每个平台原生构建（不交叉编译）：产物由 build/package.sh 生成到 build/dist/
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # tag 与 Cargo.toml 版本必须一致：产物文件名来自 Cargo.toml，错位会发布
      # "标题 v1.0.1、文件 cipherlane_1.0.0_*" 的混乱 Release
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' cipherlane-rs/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::标签 v$TAG_VER 与 cipherlane-rs/Cargo.toml version=$CARGO_VER 不一致（先同步版本再打标签）"
            exit 1
          fi
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cipherlane-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('cipherlane-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      # shell: bash（Windows 走 Git Bash）；package.sh 按 uname 自动选择平台产物
      - name: Install musl cross toolchain (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build package (native)
        shell: bash
        run: sh build/package.sh
      - name: List artifacts
        shell: bash
        run: ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: cipherlane-${{ matrix.os }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  # 仅 tag 触发：汇总三平台产物 + 统一校验和，发布到 GitHub Releases（需要 contents: write）
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate unified SHA256SUMS
        run: |
          cd dist
          rm -f cipherlane-*-SHA256SUMS.txt
          sha256sum cipherlane_* > "cipherlane-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
          cat "cipherlane-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
      # gh CLI 为 GitHub 官方工具；tag 已存在 Release 时改为补传（幂等）。
      # 必须显式带 --repo：这个 job 没有 checkout，gh 无法从当前目录推断仓库，
      # 否则三条命令都会以 "failed to run git: fatal: not a git repository" 失败
      #（v1.0.0 首次打 tag 发布就栽在这里：三平台构建全部成功，Release 没建出来）
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "cipherlane $TAG" --generate-notes
          fi
