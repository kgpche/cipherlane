name: Release

# 手动触发：只构建三平台产物并上传为 workflow artifact（不发布）
# 推送 v* 标签：构建三平台产物 + 生成 SHA256SUMS + 用官方 gh CLI 发布 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 每个平台原生构建（不交叉编译）：产物由 build/package.sh 生成到 build/dist/
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cipherlane-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('cipherlane-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      # shell: bash（Windows 走 Git Bash）；package.sh 按 uname 自动选择平台产物
      - name: Build package (native)
        shell: bash
        run: sh build/package.sh
      - name: List artifacts
        shell: bash
        run: ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: cipherlane-${{ matrix.os }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

  # 仅 tag 触发：汇总三平台产物 + 统一校验和，发布到 GitHub Releases（需要 contents: write）
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate unified SHA256SUMS
        run: |
          cd dist
          rm -f cipherlane-*-SHA256SUMS.txt
          sha256sum cipherlane_* > "cipherlane-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
          cat "cipherlane-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
      # gh CLI 为 GitHub 官方工具；tag 已存在 Release 时改为补传（幂等）
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "cipherlane $TAG" --generate-notes
          fi
